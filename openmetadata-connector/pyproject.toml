[project]
name = "polaris-iceberg-connector"
version = "0.1.0"
description = "OpenMetadata custom connector that ingests an Iceberg REST catalog (Apache Polaris)"
requires-python = ">=3.10"
dependencies = [
    # The REST catalog client. The connector this is derived from pinned 0.5.1
    # (2023); 0.12 is current and every call it makes still exists. 0.12 is also
    # what brings the OAuth2 AuthManager, which is how the Keycloak client
    # credentials flow is configured -- see polaris_iceberg.config.
    "pyiceberg[s3fs]>=0.12,<0.13",
]

# `openmetadata-ingestion` is deliberately absent: it is the framework this
# plugs into and the ingestion image already carries it. Declaring it here would
# resolve a second, conflicting copy into that image.

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_iceberg"]

[tool.pytest.ini_options]
addopts = "-ra"
