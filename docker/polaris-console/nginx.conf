# Mirrors the location blocks from upstream's docker/nginx.conf, rewritten for the stock nginx
# image layout rather than Red Hat UBI's /opt/app-root tree.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Single-page app: every unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config is regenerated on every container start, so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
