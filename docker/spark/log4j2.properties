# Correlation-ID-aware logging.
#
# The stock Spark template pattern carries no %X, so MDC is invisible. The bracketed
# MDC block below deliberately mirrors Polaris's own
#   [%X{requestId},%X{realmId}]
# so that a single correlation ID lines up visually across both services' logs.

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p [%X{correlationId},%X{principal}] %c{1}: %m%n%ex

# Our plugin is the interesting part; keep it chatty.
logger.propagation.name = io.sparkconnect.propagation
logger.propagation.level = debug

# Iceberg REST traffic is useful when debugging credential vending.
logger.icebergrest.name = org.apache.iceberg.rest
logger.icebergrest.level = info

# Noise reduction.
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.sparkui.name = org.apache.spark.ui
logger.sparkui.level = warn
logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = warn
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

# Spark's own "SparkSession.stop" / thread-dump chatter during shutdown.
logger.sparkenv.name = org.apache.spark.SparkEnv
logger.sparkenv.level = warn
