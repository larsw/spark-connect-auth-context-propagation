# ============================================================================
# Spark Connect propagation PoC -- server-owned configuration.
#
# The client configures NOTHING here. A client that can redefine
# spark.sql.catalog.* could repoint the catalog or supply its own credential,
# which would make the whole authentication story decorative.
# ============================================================================

# ---- cluster ---------------------------------------------------------------
spark.master                                     spark://spark-master:7077
# NOTE: spark.driver.host/bindAddress are set by the entrypoint for the connect role only.
# In this shared defaults file they would also apply to the master and worker, which makes
# the master advertise the driver's hostname for its own web UI.
spark.driver.memory                              1g
spark.executor.memory                            1g
spark.executor.cores                             1
spark.sql.shuffle.partitions                     4

# ---- Spark Connect ---------------------------------------------------------
spark.connect.grpc.binding.port                  15002

# Our interceptor. NOTE: despite what the docstring on this config says, it must
# implement org.sparkproject.connect.grpc.ServerInterceptor -- Spark Connect
# relocates io.grpc. See FINDINGS.md.
spark.connect.grpc.interceptor.classes           io.sparkconnect.propagation.UserTokenServerInterceptor

# Spark's own channel-level auth (PreSharedKeyAuthenticationInterceptor) owns the
# Authorization header exclusively and compares it to a single shared secret. Our
# per-user JWT therefore rides x-user-token instead. The shared secret is supplied
# via the SPARK_CONNECT_AUTHENTICATE_TOKEN environment variable, not baked in here.

# ---- propagation plugin ----------------------------------------------------
spark.connect.propagation.oidc.issuer            http://keycloak:8080/realms/spark
spark.connect.propagation.oidc.jwks-uri          http://keycloak:8080/realms/spark/protocol/openid-connect/certs
spark.connect.propagation.oidc.token-endpoint    http://keycloak:8080/realms/spark/protocol/openid-connect/token
spark.connect.propagation.oidc.expected-audience spark-connect
spark.connect.propagation.exchange.client-id     spark-connect
spark.connect.propagation.exchange.audience      polaris
spark.connect.propagation.header.token           x-user-token
spark.connect.propagation.header.correlation-id  x-correlation-id
# exchange client secret comes from SPARK_CONNECT_PROPAGATION_CLIENT_SECRET

# ---- Iceberg / Polaris catalog ---------------------------------------------
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.polaris                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.polaris.type                   rest
spark.sql.catalog.polaris.uri                    http://polaris:8181/api/catalog
spark.sql.catalog.polaris.warehouse              poc_catalog
spark.sql.catalog.polaris.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.polaris.header.X-Iceberg-Access-Delegation  vended-credentials

# The whole point: per-request auth for outgoing Iceberg REST calls. This AuthManager
# resolves the caller from the ExecutionThread's job tag and stamps the exchanged
# Polaris token plus X-Request-ID onto every request.
spark.sql.catalog.polaris.rest.auth.type         io.sparkconnect.propagation.PropagatingRestAuthManager

# Iceberg caches loaded tables, so a repeated query can be served without any REST call and
# therefore leaves no trace in Polaris at all. For a PoC whose entire point is observing
# propagation, that silence is worse than the cost of disabling it: every catalog operation
# should be visible. Do not copy this setting into anything performance-sensitive.
spark.sql.catalog.polaris.cache-enabled          false

spark.sql.defaultCatalog                         polaris

# ---- DELIBERATE OMISSION ---------------------------------------------------
# There are NO S3 credentials configured here, and none in the images, precisely so
# that a successful read from the worker is itself proof that Polaris vended
# credentials for the authenticated user. Only the Polaris container holds MinIO's
# root credentials. If an s3.access-key-id ever appears in this file, the executor
# proof in tests/ is void.
