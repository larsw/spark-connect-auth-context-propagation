# A Polaris table or view (Polaris's TABLE_LIKE).
#
# An analyst may read the tables in `shared`, and nothing else. The list below leaves out
# LOAD_TABLE_WITH_WRITE_DELEGATION on purpose: on a delegated load Polaris asks for write delegation
# first and only falls back to read when that is refused, so allowing it here would hand a reader an
# S3 key that can write. tests/test_propagation.py checks the scope of the key bob actually gets.
apiVersion: api.cerbos.dev/v1
# tag::policy[]
resourcePolicy:
  version: default
  resource: TABLE_LIKE
  importDerivedRoles: [poc_roles]
  variables:
    local:
      in_shared: >-
        has(R.attr.parents) &&
        R.attr.parents.exists(p, p.type == "NAMESPACE" && p.name == "shared")
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: [data_engineer]
    - actions:
        - LOAD_TABLE
        - LOAD_TABLE_WITH_READ_DELEGATION
        - TABLE_EXISTS
        - LOAD_VIEW
        - VIEW_EXISTS
        - REPORT_READ_METRICS
        - GET_APPLICABLE_POLICIES_ON_TABLE
      effect: EFFECT_ALLOW
      derivedRoles: [analyst]
      condition: {match: {expr: V.in_shared}}
# end::policy[]
