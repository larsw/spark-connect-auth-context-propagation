# Polaris's own root principal, which `make bootstrap` runs as.
#
# With an external PDP, every decision goes to the PDP, even the bootstrap's: creating the catalog,
# the principals and principal roles, and assigning roles. No other rule here allows those, so root
# gets them by name. (Data engineers' `*` on CATALOG and NAMESPACE does let them create catalog
# roles, add grants and drop the catalog.)
#
# A principal policy matches on the principal's name alone, so it is kept narrow: only Polaris's
# resource kinds, and only requests that carry Polaris's realm attribute, which the Spark Connect
# plugin never sends. A Keycloak user who happened to be called root gets nothing from this in
# Spark Connect.
apiVersion: api.cerbos.dev/v1
principalPolicy:
  principal: root
  version: default
  rules:
    - resource: ROOT
      actions: &from-polaris
        - action: "*"
          effect: EFFECT_ALLOW
          condition:
            match:
              expr: has(P.attr.realm) && P.attr.realm == "POLARIS"
    - resource: PRINCIPAL
      actions: *from-polaris
    - resource: PRINCIPAL_ROLE
      actions: *from-polaris
    - resource: CATALOG
      actions: *from-polaris
    - resource: CATALOG_ROLE
      actions: *from-polaris
    - resource: NAMESPACE
      actions: *from-polaris
    - resource: TABLE_LIKE
      actions: *from-polaris
    - resource: POLICY
      actions: *from-polaris
