# A Polaris catalog.
#
# A data engineer may do anything to a catalog's contents. An analyst may look at the catalog and
# list its namespaces, which is how the Polaris console and Spark find their way to `shared`.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: CATALOG
  importDerivedRoles: [poc_roles]
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles: [data_engineer]

    - actions:
        - GET_CATALOG
        - LIST_NAMESPACES
        - LIST_POLICY
        - GET_APPLICABLE_POLICIES_ON_CATALOG
      effect: EFFECT_ALLOW
      derivedRoles: [analyst]
