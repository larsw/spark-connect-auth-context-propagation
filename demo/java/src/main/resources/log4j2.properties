# Without a config on the classpath Spark prints "Using Spark's default log4j profile ..." and
# then INFO chatter, both of which land in the middle of the walkthrough's narrative. The Python
# demo has no such noise, so quieten this one to match.
#
# Everything goes to stderr, so the demo's own output on stdout stays clean enough to pipe.

rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# The connect client announces each session it opens at INFO; nothing here needs it.
logger.connect.name = org.apache.spark.sql.connect
logger.connect.level = error
