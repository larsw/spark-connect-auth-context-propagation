[package]
name = "spark-connect-propagation-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Spark Connect client that threads a user token and a correlation ID through to the server"
repository = "https://github.com/larsw/spark-connect-auth-context-propagation"

[dependencies]
# The Rust Spark Connect client. Published protos are Spark 3.5; verified against our 4.1.3
# server, since the Connect protocol is backwards compatible for what this exercises.
spark-connect-rs = "0.0.2"

# OAuth over HTTP. rustls rather than native-tls so there is no OpenSSL system dependency;
# the sandbox issuer is plain HTTP, but a real one would not be.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
