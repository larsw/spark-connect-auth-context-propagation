    <title>SPARQL console</title>
    <!--
      Runtime configuration, regenerated by the container on every start. A classic script, so it
      runs before the deferred module below and window.APP_CONFIG is always there by the time the
      app reads it. In `bun run dev` this 404s harmlessly and src/config.ts falls back to the
      Vite env.
    -->
    <script src="/config.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
