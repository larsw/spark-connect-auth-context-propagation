# Spark Connect token + correlation-ID propagation PoC.
#
# Hostnames matter here. Every party -- your browser during device flow, the PySpark
# client on the host, Polaris fetching JWKS, and our Java validator -- must reach
# Keycloak at the SAME URL, because Keycloak stamps exactly one issuer into every
# token. That is why KC_HOSTNAME is the compose service name and why install.sh adds
# loopback aliases for these names.

name: spark-connect-propagation

x-spark-common: &spark-common
  build:
    context: ./docker/spark
  image: spark-connect-propagation/spark:4.1.3
  restart: unless-stopped

services:

  # ---------------------------------------------------------------- Keycloak --
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer for browser and containers alike -- see the note at the top.
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/spark-realm.json:/opt/keycloak/data/import/spark-realm.json:ro
    # --features=authzen turns on Keycloak's experimental Authorization API (AuthZEN) endpoints,
    # which is what makes this Keycloak a Policy Decision Point that Polaris can call. Confirm with
    #   curl -s http://keycloak:8080/realms/spark/.well-known/authzen-configuration
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--features=authzen"]
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ------------------------------------------------------------------- MinIO --
  # Docker Hub's minio/minio is gone (404); the images live on quay.io now.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      minio-audit:
        condition: service_started
    environment:
      MINIO_ROOT_USER: minio_root
      MINIO_ROOT_PASSWORD: m1n1opwd
      # Audit every S3 request so the tests can prove which credential the executor used.
      MINIO_AUDIT_WEBHOOK_ENABLE_poc: "on"
      MINIO_AUDIT_WEBHOOK_ENDPOINT_poc: "http://minio-audit:8888/audit"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      # Without this, recreating the container silently destroys every table's data files
      # while Polaris happily keeps serving metadata that points at them.
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >-
        mc alias set poc http://minio:9000 minio_root m1n1opwd &&
        (mc mb --ignore-existing poc/warehouse) &&
        mc ls poc &&
        echo "bucket ready"

  minio-audit:
    image: python:3.12-slim
    command: ["python", "/collector.py"]
    volumes:
      - ./docker/minio-audit/collector.py:/collector.py:ro
      - audit:/audit
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8888/')\""]
      interval: 3s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------- Polaris --
  polaris:
    # A FORK, not the released image: larsw/polaris @ feat/authzen-pdp-support, which adds the
    # AuthZEN authorizer. Built locally by `make polaris-image` -- see docker/polaris-authzen/.
    image: spark-connect-propagation/polaris-authzen:1.8.0-SNAPSHOT
    ports:
      - "8181:8181"
      - "8182:8182"
    depends_on:
      keycloak:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      # Root principal for bootstrap (internal auth); alice/bob arrive via Keycloak.
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      polaris.realm-context.realms: "POLARIS"

      # 'mixed' so the bootstrap can use internal root credentials while end users
      # authenticate with externally-issued Keycloak tokens.
      polaris.authentication.type: "mixed"
      polaris.authentication.authenticator.type: "default"

      quarkus.oidc.tenant-enabled: "true"
      quarkus.oidc.auth-server-url: "http://keycloak:8080/realms/spark"
      quarkus.oidc.client-id: "polaris"
      quarkus.oidc.roles.role-claim-path: "principal_roles"

      # Re-fetch the JWKS quickly when a token arrives signed by a key Polaris has not
      # seen. Quarkus waits 10 minutes between forced re-fetches by default, which is a
      # sensible rate limit against a hostile `kid` but means that recreating the Keycloak
      # container -- which regenerates the realm's signing keys, and is how a realm change
      # is applied here -- leaves every user token failing authentication for ten minutes
      # with `JWK with kid '...' is not available`. Polaris then falls back to token
      # introspection, which is not configured with a client secret and fails too, so the
      # visible symptom is a bare 401. This is the authentication half of the same class of
      # problem as the PDP token cache; see docker/polaris-authzen/patches/ for that one.
      quarkus.oidc.token.forced-jwk-refresh-interval: "5S"

      # Resolve the Polaris principal BY NAME. Deliberately no id-claim-path: principals
      # must already exist in Polaris (DefaultAuthenticator does not support federated
      # principals), and name resolution avoids having to round-trip Polaris's numeric
      # principal IDs back into Keycloak claims.
      polaris.oidc.principal-mapper.name-claim-path: "principal_name"

      # Keycloak realm role 'data_engineer' -> Polaris 'PRINCIPAL_ROLE:data_engineer'.
      # $$1 is escaped so compose does not interpolate it.
      polaris.oidc.principal-roles-mapper.mappings[0].regex: "(.+)"
      polaris.oidc.principal-roles-mapper.mappings[0].replacement: "PRINCIPAL_ROLE:$$1"

      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"S3\"]"

      # Put the principal in the STS session name, so it becomes `polaris-alice` / `polaris-bob`
      # rather than a shared `polaris`. Polaris caches vended credentials on a key that includes
      # the session name, so without this alice and bob share one cache entry and are handed the
      # SAME access key and session token. Polaris's own docs call the cost out: "degradation in
      # temporary credential caching as catalog will no longer be able to reuse credentials for
      # multiple principals" -- which is exactly the property we want.
      polaris.features."INCLUDE_PRINCIPAL_NAME_IN_SUBSCOPED_CREDENTIAL": "true"

      # The console is a browser app calling Polaris from its own origin, so CORS has to be
      # opened for it. Quarkus defaults this to false.
      quarkus.http.cors.enabled: "true"
      quarkus.http.cors.origins: "http://polaris-console:3000,http://localhost:3000"
      quarkus.http.cors.methods: "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS"
      quarkus.http.cors.headers: "*"
      quarkus.http.cors.exposed-headers: "*"
      polaris.readiness.ignore-severe-issues: "true"
      quarkus.otel.sdk.disabled: "true"

      # ---- AuthZEN: authorization decisions come from Keycloak, not from Polaris grants ----
      # Polaris stops deciding and asks a Policy Decision Point over the OpenID AuthZEN
      # Authorization API. The grants the bootstrap still creates are no longer what answers
      # "may bob read this?" -- the polaris-pdp client's permissions in the realm are.
      polaris.authorization.type: "authzen"

      # Endpoints are discovered from <pdp-uri>/.well-known/authzen-configuration.
      polaris.authorization.authzen.pdp-uri: "http://keycloak:8080/realms/spark"

      # Keycloak requires the caller to be a client with authorization services enabled, and
      # issues short-lived tokens, so Polaris fetches and refreshes its own.
      polaris.authorization.authzen.auth.type: "client-credentials"
      polaris.authorization.authzen.auth.client-credentials.token-endpoint: "http://keycloak:8080/realms/spark/protocol/openid-connect/token"
      polaris.authorization.authzen.auth.client-credentials.client-id: "polaris-pdp"
      polaris.authorization.authzen.auth.client-credentials.client-secret: "polaris-pdp-secret"

      # Payload shaping for Keycloak. `name` rather than the default `path` so resource.id is the
      # leaf -- `events`, `salaries` -- which is what the realm registers as resources, and what
      # lets one policy distinguish the shared table from the restricted one.
      polaris.authorization.authzen.mapping.subject-id-prefix: "username:"
      polaris.authorization.authzen.mapping.resource-type-prefix: "polaris:"
      polaris.authorization.authzen.mapping.resource-id-format: "name"

      # Polaris is the ONLY component holding MinIO's root credentials -- it needs them
      # to call STS AssumeRole when vending scoped credentials. Spark has none.
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minio_root
      AWS_SECRET_ACCESS_KEY: m1n1opwd
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

  polaris-setup:
    image: alpine/curl:8.21.0
    depends_on:
      polaris:
        condition: service_healthy
    volumes:
      - ./docker/polaris:/bootstrap:ro
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]

  # ---------------------------------------------------------- Polaris console --
  # The Apache Polaris web console, from apache/polaris-tools (the main polaris repo has no UI).
  # It signs in through Keycloak as alice or bob, so it shows that user's view of the catalog --
  # bob simply cannot see the restricted namespace.
  polaris-console:
    build:
      context: ./docker/polaris-console
    image: spark-connect-propagation/polaris-console:0.1.0
    restart: unless-stopped
    depends_on:
      polaris:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      # NOTE: every URL here is resolved by the BROWSER, not by this container -- the console is
      # static files and all its calls are made from the user's machine. That is why they use the
      # same service-name hostnames as the rest of the stack, which install.sh maps to loopback.
      VITE_POLARIS_API_URL: "http://polaris:8181"
      VITE_POLARIS_REALM: "POLARIS"
      VITE_POLARIS_PRINCIPAL_SCOPE: "PRINCIPAL_ROLE:ALL"
      VITE_POLARIS_REALM_HEADER_NAME: "Polaris-Realm"
      # Kept so the console can still fall back to Polaris's internal root credentials.
      VITE_OAUTH_TOKEN_URL: "http://polaris:8181/api/catalog/v1/oauth/tokens"
      # Preferred path: log in as a real user against the same realm Spark uses.
      VITE_OIDC_ISSUER_URL: "http://keycloak:8080/realms/spark"
      VITE_OIDC_CLIENT_ID: "polaris-console"
      # localhost, and NOT http://polaris-console:3000 like everything else here. PKCE S256 needs
      # crypto.subtle.digest, and browsers expose window.crypto.subtle only in a secure context:
      # HTTPS, or plain HTTP on localhost / 127.0.0.1 / ::1. That test is on the literal hostname,
      # so an /etc/hosts alias pointing at loopback does not qualify -- on the service name
      # crypto.subtle is undefined and the sign-in button dies with "Cannot read properties of
      # undefined (reading 'digest')". The console's own origin is not an issuer, so using
      # localhost here costs none of the hostname consistency the rest of the stack needs.
      # Keycloak's polaris-console client registers both origins, so only this value decides.
      VITE_OIDC_REDIRECT_URI: "http://localhost:3000/auth/callback"
      VITE_OIDC_SCOPE: "openid profile email"
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first and nginx here
      # listens on IPv4 only, so the check fails while the site is perfectly healthy.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------------- OpenLineage / Marquez --
  # Where the Spark listener's lineage events land. Marquez is the OpenLineage reference
  # implementation: the API ingests events, the web UI draws the graph.
  marquez-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Marquez's packaged marquez.dev.yml hardcodes the database, user and password and only
      # templates the host and port, so these three names are not ours to choose.
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 5s
      retries: 20

  marquez:
    image: marquezproject/marquez:0.51.1
    restart: unless-stopped
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      # Defaults to true and then looks for an OpenSearch at host `opensearch`, which is not
      # part of this stack. Left on, every start logs connection failures and search 500s.
      SEARCH_ENABLED: "false"
    ports:
      - "5000:5000"
      - "5001:5001"
    healthcheck:
      # Dropwizard puts its health endpoint on the admin connector, not the application one.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5001/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    restart: unless-stopped
    depends_on:
      marquez:
        condition: service_healthy
    environment:
      # All three are required; the entrypoint exits if any is missing.
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      # 3001 on the host because the Polaris console already has 3000. The UI proxies /api/v1
      # to the API server-side, so the browser only ever talks to this one origin -- no CORS,
      # and the API does not need to be reachable from the browser at all.
      - "3001:3000"

  # ------------------------------------------------------------------ client --
  # Profiled, so it never starts with the stack. Run it explicitly:
  #   docker compose run --rm client tests/smoke.py
  client:
    profiles: ["tools"]
    build:
      context: ./docker/client
    image: spark-connect-propagation/client:0.1.0
    depends_on:
      spark-connect:
        condition: service_healthy
    environment:
      SPARK_REMOTE: "sc://spark-connect:15002"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/spark"
      POLARIS_URL: "http://polaris:8181"
      # Port 80 inside the network: 3000 is only the host-published port, so the default the
      # tests use on the host would connect-refuse from in here.
      POLARIS_CONSOLE_URL: "http://polaris-console"
      CONNECT_SHARED_SECRET: "${CONNECT_SHARED_SECRET:-poc-shared-secret}"
    volumes:
      - ./client:/work/client:ro
      - ./demo:/work/demo:ro
      - ./tests:/work/tests:ro
      # Read-only, and only so the correlation-ID assertion can read service logs from inside
      # the network. Nothing else in the PoC touches the docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - audit:/audit:ro
    entrypoint: ["python"]

  # ------------------------------------------------------------------- Spark --
  spark-master:
    <<: *spark-common
    environment:
      SPARK_ROLE: master
    ports:
      - "8082:8080"
      - "7077:7077"
    healthcheck:
      # dash has no /dev/tcp, and CMD-SHELL uses /bin/sh -- so call bash explicitly.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/spark-master/7077"]
      interval: 3s
      timeout: 3s
      retries: 20

  spark-worker:
    <<: *spark-common
    environment:
      SPARK_ROLE: worker
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"

  spark-connect:
    <<: *spark-common
    environment:
      SPARK_ROLE: connect
      # Spark's own channel-level pre-shared key, checked against the Authorization
      # header by PreSharedKeyAuthenticationInterceptor. The per-user JWT is separate
      # and rides x-user-token.
      SPARK_CONNECT_AUTHENTICATE_TOKEN: "${CONNECT_SHARED_SECRET:-poc-shared-secret}"
      SPARK_CONNECT_PROPAGATION_CLIENT_SECRET: "spark-connect-secret"
    depends_on:
      spark-master:
        condition: service_healthy
      polaris-setup:
        condition: service_completed_successfully
    ports:
      - "15002:15002"
      - "4040:4040"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/15002"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  # ----------------------------------------------------------- OpenMetadata --
  # All profiled: this is another four containers and roughly 4 GB, and the rest
  # of the PoC does not need them. Bring them up with
  #   make om-up      (docker compose --profile openmetadata up -d)
  #
  # Airflow is deliberately absent. The quickstart runs an Airflow scheduler as
  # the "ingestion" service, but ingestion here is a one-shot `metadata ingest`,
  # so PIPELINE_SERVICE_CLIENT_ENABLED is false and that container is not built.
  # Neither MySQL nor Elasticsearch publishes a port: nothing outside the
  # network talks to them, and it keeps them off the host's port space.
  openmetadata-db:
    profiles: ["openmetadata"]
    image: docker.getcollate.io/openmetadata/db:2.0.2
    command: "--sort_buffer_size=10M"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - openmetadata-db:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --silent --execute "use openmetadata_db"
      interval: 10s
      timeout: 10s
      retries: 20

  openmetadata-search:
    profiles: ["openmetadata"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Half the quickstart's 1 GB. The catalog being indexed here is two tables.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # OpenMetadata's migration creates ~40 indices back to back. On a host whose
      # disk is already fairly full, the high watermark (90%) makes Elasticsearch
      # refuse to allocate their shards, and at the flood stage (95%) it marks
      # them read-only -- which looks like a hung migration, not a disk problem.
      # None of it is meaningful for a single node holding two tables.
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - openmetadata-search:/usr/share/elasticsearch/data
    # 2 GB, not the 1 GB the 512 MB heap suggests: Lucene lives off-heap, and at
    # 1 GB this container sat at 98% and the health check started timing out.
    mem_limit: 2g
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 10s
      timeout: 10s
      retries: 20

  # Schema migrations. The server refuses to start against an unmigrated
  # database, so this has to complete first -- exactly as in the quickstart.
  openmetadata-migrate:
    profiles: ["openmetadata"]
    image: docker.getcollate.io/openmetadata/server:2.0.2
    command: "./bootstrap/openmetadata-ops.sh migrate"
    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata-search:
        condition: service_healthy
    environment: &openmetadata-env
      DB_HOST: openmetadata-db
      DB_PORT: "3306"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      DB_SCHEME: mysql
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_PARAMS: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      OPENMETADATA_HEAP_OPTS: "-Xmx1G -Xms1G"

  openmetadata-server:
    profiles: ["openmetadata"]
    image: docker.getcollate.io/openmetadata/server:2.0.2
    restart: unless-stopped
    depends_on:
      openmetadata-migrate:
        condition: service_completed_successfully
    environment:
      <<: *openmetadata-env
      # No Airflow in this stack, so the server must not health-check one.
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      # Local basic auth. Deliberately NOT wired to the Keycloak realm: the
      # realm models Polaris principals, and giving OpenMetadata its own login
      # keeps the two authorization stories from being confused for each other.
      # What does use Keycloak is the ingestion client -- see the runner below.
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
    ports:
      - "8585:8585"
      - "8586:8586"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  # One-shot crawler. Carries the revived Iceberg connector and reaches Polaris
  # as the Keycloak client `openmetadata` using OAuth 2.0 client credentials.
  #   make om-ingest
  openmetadata-ingest:
    profiles: ["openmetadata-tools"]
    build:
      context: .
      dockerfile: docker/openmetadata/Dockerfile
    image: spark-connect-propagation/openmetadata-ingest:0.1.0
    depends_on:
      openmetadata-server:
        condition: service_healthy
      polaris:
        condition: service_healthy
    environment:
      OM_HOST: "http://openmetadata-server:8585"
    mem_limit: 1g

volumes:
  audit:
  minio-data:
  marquez-db:
  openmetadata-db:
  openmetadata-search:
